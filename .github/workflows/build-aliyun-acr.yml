name: Build and Push Aliyun ACR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag, for example 20260601 or v1.0.0"
        required: true
        type: string
        default: "20260601"
      image_repository:
        description: "ACR namespace/repository"
        required: true
        type: string
        default: "tiandou/tian-dou"
      platforms:
        description: "Docker platforms"
        required: true
        type: string
        default: "linux/amd64"
      upload_deploy_bundle:
        description: "Build and upload deployment bundle artifact"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: aliyun-acr-${{ github.ref }}-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6

      - name: Validate Aliyun ACR secrets
        run: |
          test -n "${{ secrets.ALIYUN_REGISTRY }}" || (echo "Missing secret: ALIYUN_REGISTRY" && exit 1)
          test -n "${{ secrets.ALIYUN_USERNAME }}" || (echo "Missing secret: ALIYUN_USERNAME" && exit 1)
          test -n "${{ secrets.ALIYUN_PASSWORD }}" || (echo "Missing secret: ALIYUN_PASSWORD" && exit 1)

      - name: Prepare image reference
        env:
          RAW_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          RAW_REPOSITORY: ${{ inputs.image_repository }}
          RAW_TAG: ${{ inputs.image_tag }}
        run: |
          REGISTRY="$(printf '%s' "$RAW_REGISTRY" | tr -d '\r\n[:space:]' | sed 's#^https\?://##; s#/*$##')"
          REPOSITORY="$(printf '%s' "$RAW_REPOSITORY" | tr -d '\r\n[:space:]' | sed 's#^/*##; s#/*$##')"
          TAG="$(printf '%s' "$RAW_TAG" | tr -d '\r\n[:space:]')"

          if [ -z "$REGISTRY" ] || [ -z "$REPOSITORY" ] || [ -z "$TAG" ]; then
            echo "Invalid image reference parts" >&2
            exit 1
          fi

          IMAGE="${REGISTRY}/${REPOSITORY}:${TAG}"
          echo "ALIYUN_REGISTRY_CLEAN=${REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "Image: ${IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY_CLEAN }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            COMMIT=${{ github.sha }}
            DATE=${{ github.run_started_at }}

      - name: Package deploy bundle
        if: ${{ inputs.upload_deploy_bundle }}
        run: bash deploy/package-deploy-bundle.sh

      - name: Upload deploy bundle
        if: ${{ inputs.upload_deploy_bundle }}
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-deploy-bundle-${{ inputs.image_tag }}
          path: sub2api-deploy-bundle.tar.gz
          retention-days: 30

      - name: Summary
        run: |
          echo "### Aliyun ACR image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy with:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "SUB2API_IMAGE=${IMAGE} \\" >> "$GITHUB_STEP_SUMMARY"
          echo "SUB2API_INSTANCE=tiandou-prod \\" >> "$GITHUB_STEP_SUMMARY"
          echo "SUB2API_PORT=8080 \\" >> "$GITHUB_STEP_SUMMARY"
          echo "./docker-deploy.sh" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose up -d" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
